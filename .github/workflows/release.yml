name: Release

# Bumping "version" in package.json on master builds the Windows installers and the Linux AppImage and publishes the release
# (the release creates the v<version> tag). Pushing a tag like v0.1.0 by hand does the same.
on:
  push:
    branches: [master]
    paths: [package.json]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.exists.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      # A package.json change that isn't a version bump finds its release already there and stops.
      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v${version}" >/dev/null 2>&1 && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version}" >&2
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          # The section under "## <version>", up to the next "## " heading.
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "No CHANGELOG.md entry for ${version}" > release-notes.md; fi
          {
            echo 'body<<CHANGELOG_EOF'
            cat release-notes.md
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Lets "Check for updates" in this build look at this repo's releases.
          ESKY_UPDATE_REPO: ${{ github.repository }}
          # Signs the update files; the app only installs updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Esky v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          # latest.json points the updater at the per-user NSIS installer.
          updaterJsonPreferNsis: true

  # After the Windows job, so the release and latest.json exist before the AppImage is added to them.
  release-linux:
    needs: [check, release]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install the Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # Only the AppImage: it is the one Linux format the updater can replace in place, and it runs on Arch.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ESKY_UPDATE_REPO: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Esky v__VERSION__
          releaseDraft: false
          prerelease: false
          args: --bundles appimage
